<div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto;">
    <h2>You've been invited!</h2>
    <p>Hello,</p>
    <p><strong>{{ inviter_name }}</strong> has invited you to join the workspace <strong>{{ workspace_name }}</strong>
        on {{ project_name }}.</p>
    <div style="text-align: center; margin: 30px 0;">
        <a href="{{ invite_link }}"
            style="background-color: #007bff; color: white; padding: 12px 24px; text-decoration: none; border-radius: 4px; font-weight: bold;">Join
            Workspace</a>
    </div>
    <p style="color: #666; font-size: 14px;">Or copy and paste this link into your browser:</p>
    <p style="color: #666; font-size: 14px; word-break: break-all;">{{ invite_link }}</p>
</div>
