[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "W291", "W293", "E711", "E712", "E402", "E701"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811", "F401", "E402", "F841"]
"alembic/*" = ["F401", "F403", "F811"]
