<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      @keyframes popNode {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px #14B8A6); }
        50% { transform: scale(1.05); filter: drop-shadow(0 0 15px #14B8A6); }
      }
      @keyframes slidePath {
        0% { stroke-dashoffset: 100; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @keyframes floatLead {
        0% { transform: translate(0, 0); opacity: 0; }
        10% { opacity: 1; }
        40% { transform: translate(150px, 0); opacity: 1; } /* At router */
        50% { transform: translate(150px, 0); opacity: 1; } /* Processing */
        90% { transform: translate(350px, -80px); opacity: 1; } /* Route up */
        100% { transform: translate(350px, -80px); opacity: 0; }
      }
      @keyframes floatLead2 {
        0% { transform: translate(0, 0); opacity: 0; }
        10% { opacity: 1; }
        40% { transform: translate(150px, 0); opacity: 1; } 
        50% { transform: translate(150px, 0); opacity: 1; } 
        90% { transform: translate(350px, 80px); opacity: 1; } /* Route down */
        100% { transform: translate(350px, 80px); opacity: 0; }
      }
      .bg { fill: #040914; }
      .panel { fill: #0B1320; stroke: #14B8A6; stroke-width: 1.5; rx: 12; }
      .text-title { font-family: system-ui, sans-serif; font-size: 14px; font-weight: bold; fill: #F1F5F9; }
      .text-sub { font-family: system-ui, sans-serif; font-size: 12px; fill: #94A3B8; }
      .text-tag { font-family: monospace; font-size: 10px; font-weight: bold; fill: #14B8A6; }
      .route-path { fill: none; stroke: rgba(20, 184, 166, 0.4); stroke-width: 2; stroke-dasharray: 6 6; }
    </style>
  </defs>

  <rect class="bg" width="800" height="500" />

  <!-- Background Grid -->
  <path d="M 0 50 L 800 50 M 0 100 L 800 100 M 0 150 L 800 150 M 0 200 L 800 200 M 0 250 L 800 250 M 0 300 L 800 300 M 0 350 L 800 350 M 0 400 L 800 400 M 0 450 L 800 450 M 50 0 L 50 500 M 100 0 L 100 500 M 150 0 L 150 500 M 200 0 L 200 500 M 250 0 L 250 500 M 300 0 L 300 500 M 350 0 L 350 500 M 400 0 L 400 500 M 450 0 L 450 500 M 500 0 L 500 500 M 550 0 L 550 500 M 600 0 L 600 500 M 650 0 L 650 500 M 700 0 L 700 500 M 750 0 L 750 500" stroke="rgba(255,255,255,0.02)" stroke-width="1" fill="none" />

  <!-- Incoming Qualified Lead -->
  <g transform="translate(80, 250)">
    <!-- Animated Lead Packet 1 (Goes UP to Enterprise) -->
    <g style="animation: floatLead 4s infinite linear;">
      <rect x="-40" y="-20" width="80" height="40" rx="20" fill="#1E293B" stroke="#10B981" stroke-width="2" />
      <text x="0" y="5" text-anchor="middle" class="text-tag" fill="#10B981">Lead (Score: 92)</text>
    </g>
    <!-- Animated Lead Packet 2 (Goes DOWN to SMB) -->
    <g style="animation: floatLead2 4s infinite linear; animation-delay: 2s;">
      <rect x="-40" y="-20" width="80" height="40" rx="20" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
      <text x="0" y="5" text-anchor="middle" class="text-tag" fill="#38BDF8">Lead (Score: 65)</text>
    </g>
  </g>

  <!-- Central AI Router -->
  <g transform="translate(230, 200)">
    <rect class="panel" width="160" height="100" style="animation: popNode 3s infinite;" />
    <text x="80" y="40" text-anchor="middle" class="text-title" style="fill: #14B8A6;">AI Smart Router</text>
    <rect x="20" y="55" width="120" height="6" rx="3" fill="#1E293B" />
    <rect x="20" y="70" width="80" height="6" rx="3" fill="#1E293B" />
  </g>

  <!-- Paths out of Router -->
  <path class="route-path" d="M 390 250 L 470 250 L 470 140 L 550 140" />
  <path class="route-path" d="M 390 250 L 470 250 L 470 360 L 550 360" />

  <!-- Destination 1: Enterprise Rep -->
  <g transform="translate(550, 100)">
    <rect class="panel" width="180" height="80" style="stroke: #10B981;" />
    <circle cx="35" cy="40" r="15" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981" />
    <text x="35" y="45" text-anchor="middle" class="text-title" style="fill: #10B981;">S</text> <!-- Avatar initial -->
    <text x="65" y="35" class="text-title">Sarah (Enterprise)</text>
    <text x="65" y="55" class="text-sub">Rule: Score &gt; 90</text>
  </g>

  <!-- Destination 2: SMB Rep -->
  <g transform="translate(550, 320)">
    <rect class="panel" width="180" height="80" style="stroke: #38BDF8;" />
    <circle cx="35" cy="40" r="15" fill="rgba(56, 189, 248, 0.2)" stroke="#38BDF8" />
    <text x="35" y="45" text-anchor="middle" class="text-title" style="fill: #38BDF8;">T</text>
    <text x="65" y="35" class="text-title">Tom (SMB)</text>
    <text x="65" y="55" class="text-sub">Rule: Score &lt;= 90</text>
  </g>

</svg>
