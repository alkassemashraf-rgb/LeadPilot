<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      @keyframes popIn {
        0%, 90%, 100% { opacity: 0.3; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 10px #38BDF8); }
      }
      @keyframes playhead {
        0% { transform: translateX(0); }
        100% { transform: translateX(550px); }
      }
      .bg { fill: #040914; }
      .panel { fill: #0B1320; stroke: #38BDF8; stroke-width: 1.5; rx: 12; }
      .text-title { font-family: system-ui, sans-serif; font-size: 14px; font-weight: bold; fill: #F1F5F9; }
      .text-sub { font-family: system-ui, sans-serif; font-size: 11px; fill: #94A3B8; font-weight: bold; }
      .time-sub { font-family: monospace; font-size: 12px; fill: #14B8A6; }
      .flow-line { fill: none; stroke: rgba(56, 189, 248, 0.3); stroke-width: 2; stroke-dasharray: 4 4; }
      .marker { fill: #38BDF8; }
    </style>
  </defs>

  <rect class="bg" width="800" height="500" />
  
  <text x="120" y="80" class="text-title" style="font-size: 18px; fill: #38BDF8;">Sequence: Outbound Nurture (Q3)</text>
  
  <g transform="translate(120, 150)">
    
    <!-- Step 1 -->
    <g transform="translate(0, 0)">
      <g style="animation: popIn 5s infinite; animation-delay: 0s; transform-origin: top left;">
        <rect class="panel" width="140" height="90" />
        <text x="20" y="30" class="text-title">Email: Intro</text>
        <text x="20" y="50" class="text-sub">Initial Outreach</text>
        <rect x="20" y="65" width="100" height="4" rx="2" fill="#1E293B" />
        <rect x="20" y="75" width="60" height="4" rx="2" fill="#1E293B" />
      </g>
    </g>

    <!-- Path segment 1 -->
    <path class="flow-line" d="M 140 45 L 220 45" />
    <text x="180" y="35" text-anchor="middle" class="time-sub">Wait 2d</text>

    <!-- Step 2 -->
    <g transform="translate(220, 0)">
      <g style="animation: popIn 5s infinite; animation-delay: 1.5s; transform-origin: top left;">
        <rect class="panel" width="140" height="90" style="stroke: #8B5CF6;" />
        <text x="20" y="30" class="text-title">LinkedIn Req</text>
        <text x="20" y="50" class="text-sub">Multi-channel</text>
        <rect x="20" y="65" width="80" height="4" rx="2" fill="#1E293B" />
        <rect x="20" y="75" width="40" height="4" rx="2" fill="#1E293B" />
      </g>
    </g>

    <!-- Path segment 2 -->
    <path class="flow-line" d="M 360 45 L 440 45" />
    <text x="400" y="35" text-anchor="middle" class="time-sub">Wait 3d</text>

    <!-- Step 3 -->
    <g transform="translate(440, 0)">
      <g style="animation: popIn 5s infinite; animation-delay: 3s; transform-origin: top left;">
        <rect class="panel" width="140" height="90" style="stroke: #10B981;" />
        <text x="20" y="30" class="text-title">Email: Value</text>
        <text x="20" y="50" class="text-sub">Case Study</text>
        <rect x="20" y="65" width="100" height="4" rx="2" fill="#1E293B" />
        <rect x="20" y="75" width="80" height="4" rx="2" fill="#1E293B" />
      </g>
    </g>

    <!-- Playhead timeline bar -->
    <rect x="-20" y="140" width="600" height="2" fill="#1E293B" />
    
    <!-- Moving Playhead -->
    <g style="animation: playhead 5s infinite linear;">
      <circle cx="-20" cy="141" r="6" fill="#FFFFFF" style="box-shadow: 0 0 10px #FFF;" />
      <line x1="-20" y1="140" x2="-20" y2="10" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2 2" opacity="0.5" />
      <polygon points="-26,141 -20,131 -14,141" fill="#FFFFFF" />
    </g>

  </g>
</svg>
